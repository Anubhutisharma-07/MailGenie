<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>MailGenie Settings</title>
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo-wrapper">
        <span class="logo">💌</span>
      </div>
      <h1 class="title">MailGenie AI</h1>
      <span class="subtitle">Smart Email Reply Assistant for Gmail</span>
    </header>

    <main class="form-container">
      <div class="form-group">
        <label for="backendUrl">Backend API Server URL</label>
        <div class="input-with-button">
          <input type="text" id="backendUrl" placeholder="http://localhost:8080" />
          <button id="testConnBtn" class="btn-sm" title="Test Connection">Test</button>
        </div>
      </div>

      <div class="form-group">
        <label for="provider">Default LLM Provider</label>
        <select id="provider">
          <option value="groq">⚡ Groq LPU (Ultra Fast)</option>
          <option value="openai">🧠 OpenAI GPT-4o</option>
          <option value="gemini">♊ Google Gemini 2.5</option>
          <option value="claude">🦉 Anthropic Claude 3.5</option>
        </select>
      </div>

      <div class="form-group">
        <label for="apiKey">Custom API Key (Optional Override)</label>
        <input type="password" id="apiKey" placeholder="gsk_... or sk-..." />
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label for="defaultTone">Default Tone</label>
          <select id="defaultTone">
            <option value="professional">👔 Professional</option>
            <option value="casual">☕ Casual</option>
            <option value="friendly">😊 Friendly</option>
            <option value="persuasive">🎯 Persuasive</option>
            <option value="urgent">⏰ Urgent</option>
            <option value="empathetic">❤️ Empathetic</option>
            <option value="concise">⚡ Concise</option>
            <option value="detailed">📝 Detailed</option>
          </select>
        </div>

        <div class="form-group half">
          <label for="defaultLanguage">Default Language</label>
          <select id="defaultLanguage">
            <option value="English">🇺🇸 English</option>
            <option value="Spanish">🇪🇸 Spanish</option>
            <option value="French">🇫🇷 French</option>
            <option value="German">🇩🇪 German</option>
            <option value="Italian">🇮🇹 Italian</option>
            <option value="Japanese">🇯🇵 Japanese</option>
            <option value="Chinese">🇨🇳 Chinese</option>
            <option value="Hindi">🇮🇳 Hindi</option>
            <option value="Portuguese">🇵🇹 Portuguese</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="customModel">Custom Model ID (Optional)</label>
        <input type="text" id="customModel" placeholder="e.g. llama-3.3-70b-versatile" />
      </div>

      <button id="saveBtn" class="btn btn-primary">Save Settings</button>
      
      <div id="status" class="status-msg hide">
        Configuration saved successfully!
      </div>
    </main>

    <footer class="footer">
      <div class="server-status-box">
        <span class="status-dot"></span>
        <span id="serverStatus" class="status-indicator">Checking backend status...</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
