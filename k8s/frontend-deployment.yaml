apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailgenie-frontend
  labels:
    app: mailgenie-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mailgenie-frontend
  template:
    metadata:
      labels:
        app: mailgenie-frontend
    spec:
      containers:
        - name: frontend
          image: mailgenie/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mailgenie-frontend-service
spec:
  selector:
    app: mailgenie-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
