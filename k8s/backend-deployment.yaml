apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailgenie-backend
  labels:
    app: mailgenie-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mailgenie-backend
  template:
    metadata:
      labels:
        app: mailgenie-backend
    spec:
      containers:
        - name: backend
          image: mailgenie/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_REDIS_HOST
              value: "redis-service"
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
            requests:
              cpu: "250m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mailgenie-backend-service
spec:
  selector:
    app: mailgenie-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
