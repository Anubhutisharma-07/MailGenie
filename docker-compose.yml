version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mailgenie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mailgenie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mailgenie-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./Backend/email-writer-s
      dockerfile: Dockerfile
    container_name: mailgenie-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mailgenie
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend/EmailwriterGenerator
      dockerfile: Dockerfile
    container_name: mailgenie-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
